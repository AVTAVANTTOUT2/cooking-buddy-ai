<app-category-list [categories]="categories" (categorySelected)="selectCategory($event)" />
@if (selectedCategory) {
  <p>Selected category: {{ selectedCategory }}</p>
}
@if (selectedName) {
  <p>Selected recipe: {{ selectedName }}</p>
}
<app-panel heading="Recipes">
  <div class="grid">
    @for (recipe of recipes; track recipe.id) {
      <app-recipe-card
        [recipe]="recipe"
        [isFavorite]="favorites.isFavorite(recipe.id)"
        (selected)="open($event)"
        (favoriteToggled)="favorites.toggleFavorite($event)"
      />
    }
  </div>
</app-panel>
